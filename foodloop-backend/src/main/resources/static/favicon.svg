<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Backdrop -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Food Bowl Base (Soft Sage Curve) -->
  <path d="M18 36 C18 45, 46 45, 46 36 Z" fill="url(#leafGrad2)" opacity="0.9" />

  <!-- Infinity Loop & Sprout Leaf Leaves -->
  <!-- Left Loop Leaf -->
  <path d="M32 20 C24 12, 12 18, 14 28 C15.5 35, 25 36, 32 28 C26 28, 20 25, 20 21 C20 17, 28 16, 32 20 Z" fill="url(#leafGrad1)" filter="url(#glow)" />

  <!-- Right Loop Leaf -->
  <path d="M32 20 C40 12, 52 18, 50 28 C48.5 35, 39 36, 32 28 C38 28, 44 25, 44 21 C44 17, 36 16, 32 20 Z" fill="url(#leafGrad2)" filter="url(#glow)" />

  <!-- Center Sprout Heart / Food Seed -->
  <circle cx="32" cy="20" r="3" fill="#ffffff" />
</svg>
